name: cinepop_ai_studio
description: CinePop AI - Complete Autonomous Movie Studio with 3D Face ID Scan, Lip-Sync & Direct Gallery Save
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.12.0
  image: ^4.3.0
  gal: ^2.3.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  video_player: ^2.9.2
  chewie: ^1.8.5
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
