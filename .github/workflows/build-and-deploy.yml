name: Build CinePop AI Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      railway_url:
        description: 'Optional Railway Backend URL override (e.g. https://cinepop-production.up.railway.app)'
        required: false
        default: ''

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Inject Railway URL (if provided via Secret or Workflow Input)
        working-directory: ./flutter_app
        env:
          RAILWAY_URL_INPUT: ${{ github.event.inputs.railway_url }}
          RAILWAY_URL_SECRET: ${{ secrets.RAILWAY_URL }}
        run: |
          TARGET_URL="${RAILWAY_URL_INPUT:-$RAILWAY_URL_SECRET}"
          if [ -n "$TARGET_URL" ]; then
            TARGET_URL="${TARGET_URL%/}"
            sed -i "s|https://YOUR-RAILWAY-APP.up.railway.app|${TARGET_URL}|g" lib/main.dart
            echo "Injected Railway URL into Flutter app."
          fi

      - name: Scaffold Android Platform & Generate Launcher Icons
        working-directory: ./flutter_app
        run: |
          flutter create --platforms=android --org com.cinepop.ai --project-name cinepop_ai_studio .
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build Release APK
        working-directory: ./flutter_app
        run: |
          flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CinePop-AI-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
