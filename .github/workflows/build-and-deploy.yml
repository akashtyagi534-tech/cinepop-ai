name: Build CinePop AI Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      railway_url:
        description: 'Optional Railway Backend URL override (e.g. https://cinepop-production.up.railway.app)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: cinepop-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Inject Railway URL (if provided via Secret or Workflow Input)
        working-directory: ./flutter_app
        env:
          RAILWAY_URL_INPUT: ${{ github.event.inputs.railway_url }}
          RAILWAY_URL_SECRET: ${{ secrets.RAILWAY_URL }}
        run: |
          TARGET_URL="${RAILWAY_URL_INPUT:-$RAILWAY_URL_SECRET}"
          if [ -n "$TARGET_URL" ]; then
            TARGET_URL="${TARGET_URL%/}"
            sed -i "s|https://cinepop-ai-production.up.railway.app|${TARGET_URL}|g" lib/main.dart
            sed -i "s|https://YOUR-RAILWAY-APP.up.railway.app|${TARGET_URL}|g" lib/main.dart
            echo "Injected Railway URL into Flutter app."
          fi

      - name: Scaffold Android Platform & Generate Launcher Icons
        working-directory: ./flutter_app
        run: |
          flutter --version
          flutter create --platforms=android --org com.cinepop.ai --project-name cinepop_ai_studio .
          python3 - <<'PY'
          import os, re
          # Ensure ProGuard keeps ML Kit Face Detection & Camera classes intact in release APK
          pg_path = "android/app/proguard-rules.pro"
          with open(pg_path, "w", encoding="utf-8") as pg:
              pg.write(
                  "-keep class com.google.mlkit.** { *; }\n"
                  "-dontwarn com.google.mlkit.**\n"
                  "-keep class com.google.android.gms.** { *; }\n"
                  "-dontwarn com.google.android.gms.**\n"
                  "-keep class io.flutter.plugins.camera.** { *; }\n"
                  "-keep class studio.midoridesign.gyawun.** { *; }\n"
              )

          for rel in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              if not os.path.exists(rel):
                  continue
              with open(rel, "r", encoding="utf-8") as f:
                  src = f.read()
              # Enforce minSdk >= 21 for camera + google_mlkit_face_detection + gal
              src = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 21", src)
              src = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 21", src)
              if "checkReleaseBuilds" not in src and "android {" in src:
                  patch = (
                      "android {\n"
                      "    lint {\n"
                      "        checkReleaseBuilds = false\n"
                      "        abortOnError = false\n"
                      "    }\n"
                  )
                  src = src.replace("android {", patch, 1)
              # Disable R8 stripping on release if not set so ML Kit native models work out of the box
              if rel.endswith(".kts") and "isMinifyEnabled" not in src and "release {" in src:
                  src = src.replace(
                      "release {",
                      "release {\n            isMinifyEnabled = false\n            isShrinkResources = false",
                      1,
                  )
              elif rel.endswith(".gradle") and "minifyEnabled" not in src and "release {" in src:
                  src = src.replace(
                      "release {",
                      "release {\n            minifyEnabled false\n            shrinkResources false",
                      1,
                  )
              with open(rel, "w", encoding="utf-8") as f:
                  f.write(src)
              print(f"Patched Gradle config in {rel}")
          PY
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build Release APK
        working-directory: ./flutter_app
        run: |
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/CinePop-AI-v${{ github.run_number }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/CinePop-AI-Latest.apk"

      - name: Publish Direct Download APK to GitHub Releases (No ZIP Needed!)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_VER="flutter_app/build/app/outputs/flutter-apk/CinePop-AI-v${{ github.run_number }}.apk"
          APK_LATEST="flutter_app/build/app/outputs/flutter-apk/CinePop-AI-Latest.apk"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$APK_LATEST" "$APK_VER" --clobber
          else
            gh release create latest "$APK_LATEST" "$APK_VER" \
              --title "CinePop AI Android APK (Latest)" \
              --notes "Direct 1-tap Android APK download — no ZIP extraction required! Build #${{ github.run_number }}"
          fi

      - name: Upload Release APK (Artifact Backup)
        uses: actions/upload-artifact@v4
        with:
          name: CinePop-AI-v${{ github.run_number }}-APK
          path: flutter_app/build/app/outputs/flutter-apk/CinePop-AI-v${{ github.run_number }}.apk
          compression-level: 0
